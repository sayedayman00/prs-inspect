<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3864">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PRS Inspect">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>PRS Site Inspection</title>
<style>
:root{
  --navy:#1F3864; --bg:#F3F5F9; --card:#fff; --text:#1b1f27; --muted:#5f6b7a; --line:#d9dee7;
  --ok:#2e7d32; --defect:#c62828; --rig:#1565c0; --nv:#6d6d6d; --na:#8d8d8d;
  --crit:#C00000; --high:#E46C0A; --med:#BF9000; --low:#548235;
  --warnbg:#fff4e0; --errbg:#fde8e8;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
header.bar{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top))}
header.bar h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.bar .sub{font-size:12px;opacity:.8;font-weight:400}
header.bar .logo{height:30px;background:#fff;border-radius:6px;padding:2px 4px;flex:0 0 auto}
header.brand{background:#fff;color:var(--navy);border-bottom:3px solid var(--navy);justify-content:space-between}
header.brand img{height:48px}
header.brand h1{flex:0 1 auto;text-align:right;color:var(--navy)}
header.bar button{background:transparent;border:0;color:#fff;font-size:22px;padding:4px 8px;min-width:40px}
main{padding:12px 12px calc(90px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.card.done{border-left:5px solid var(--ok)}
.card.defect{border-left:5px solid var(--defect)}
.card.rig{border-left:5px solid var(--rig)}
.card.flash{box-shadow:0 0 0 3px #f9a825}
.code{font-size:12px;color:var(--muted)}
.desc{font-weight:600;margin:2px 0 6px}
details{margin:4px 0 8px;font-size:14px;color:var(--muted)}
details summary{cursor:pointer;color:var(--navy)}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.seg button{flex:1 1 auto;min-height:44px;padding:6px 10px;border:1.5px solid var(--line);background:#fff;border-radius:10px;font-size:14px;font-weight:600}
.seg button.on{color:#fff}
.seg button.sugg{border-style:dashed;border-color:#555}
.s-OK.on{background:var(--ok);border-color:var(--ok)}
.s-Defect.on{background:var(--defect);border-color:var(--defect)}
.s-Notvisible.on,.s-NA.on{background:var(--nv);border-color:var(--nv)}
.s-Riggerrequired.on{background:var(--rig);border-color:var(--rig)}
.r-Critical.on{background:var(--crit);border-color:var(--crit)}
.r-High.on{background:var(--high);border-color:var(--high)}
.r-Medium.on{background:var(--med);border-color:var(--med)}
.r-Low.on{background:var(--low);border-color:var(--low)}
.opt.on{background:var(--navy);border-color:var(--navy)}
.lbl{font-size:13px;color:var(--muted);margin-top:6px}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;min-height:44px;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
textarea{min-height:60px;resize:vertical}
.req{color:var(--defect);font-weight:700}
.row{display:flex;gap:8px;align-items:center}
.row > *{flex:1}
.photos{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.thumb{position:relative;width:72px;height:72px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#eee;padding:0}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb span{position:absolute;left:0;bottom:0;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:1px 4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 14px;border-radius:10px;border:1.5px solid var(--navy);background:#fff;color:var(--navy);font-weight:600;text-decoration:none}
.btn.primary{background:var(--navy);color:#fff}
.btn.danger{border-color:var(--defect);color:var(--defect)}
.btn.small{min-height:36px;padding:4px 10px;font-size:14px}
.btn.block{width:100%}
.addphoto{width:72px;height:72px;border:1.5px dashed var(--navy);border-radius:8px;background:#fff;color:var(--navy);font-size:12px;font-weight:600}
.linkbtn{background:none;border:0;color:var(--navy);padding:6px 0;font-size:14px;font-weight:600}
.list a.item{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.list .grow{flex:1;min-width:0}
.chip{display:inline-block;font-size:12px;font-weight:700;color:#fff;border-radius:999px;padding:2px 8px;margin:2px 2px 0 0}
.chip.Critical{background:var(--crit)}.chip.High{background:var(--high)}.chip.Medium{background:var(--med)}.chip.Low{background:var(--low)}
.chip.grey{background:#9aa4b2}.chip.blue{background:var(--rig)}.chip.green{background:var(--ok)}
.progress{height:6px;background:#e3e7ee;border-radius:3px;overflow:hidden;margin-top:6px}
.progress div{height:100%;background:var(--ok)}
.muted{color:var(--muted);font-size:14px}
.issue{padding:10px;border-radius:10px;margin-bottom:6px;font-size:14px;display:block;text-decoration:none;color:inherit}
.issue.err{background:var(--errbg)}
.issue.warn{background:var(--warnbg)}
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));z-index:5}
nav.bottom .btn{flex:1;min-width:0;display:block;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:26px;font-size:15px}
.eq{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:#fafbfd}
.diff-pos{color:var(--defect);font-weight:700}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;color:#fff}
.overlay img{max-width:100%;max-height:75vh;border-radius:6px}
.overlay .row{margin-top:12px;width:100%;max-width:480px}
h2{font-size:16px;margin:16px 0 8px;color:var(--navy)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));background:#323232;color:#fff;padding:10px 16px;border-radius:8px;z-index:30;font-size:14px;max-width:90%}
@media (prefers-color-scheme: dark){
  :root{--bg:#12161d;--card:#1c222c;--text:#e8ecf2;--muted:#9aa6b6;--line:#333c4a;--warnbg:#3a2e14;--errbg:#3d1c1c}
  .seg button,input[type=text],input[type=number],input[type=date],select,textarea,.btn,.addphoto,nav.bottom{background:#1c222c}
  .btn.primary{background:#3b5ea8;border-color:#3b5ea8}
  .btn,.addphoto,.linkbtn,details summary{color:#9db8f0;border-color:#9db8f0}
  .eq{background:#171c24}
}
</style>
</head>

function setting(k, v) {

}

  document.body.appendChild(t); setTimeout(() => t.remove(), ms);

/* ---------------- storage (IndexedDB) ---------------- */
let db;
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open("prs_field", 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      d.createObjectStore("sites", {keyPath: "uid"});
      d.createObjectStore("photos", {keyPath: "key"}).createIndex("uid", "uid");
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function tx(store, mode, fn) {
  return new Promise((res, rej) => {
    const t = db.transaction(store, mode); let out;
    const r = fn(t.objectStore(store));
    if (r) r.onsuccess = () => { out = r.result; };
    t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
}
const dbAll = s => tx(s, "readonly", st => st.getAll());
const dbGet = (s, k) => tx(s, "readonly", st => st.get(k));
const dbPut = (s, v) => tx(s, "readwrite", st => st.put(v));
const dbDel = (s, k) => tx(s, "readwrite", st => st.delete(k));
const sitePhotos = uid => tx("photos", "readonly", st => st.index("uid").getAll(uid));

/* ---------------- library helpers ---------------- */
const typeOf = code => LIB.types.find(t => t.code === code);
function itemsFor(typeCode) {
  const t = typeOf(typeCode); if (!t) return [];
  const tags = new Set(t.tags);
  return LIB.items.filter(i => i.tags.some(g => tags.has(g)));
}
function sectionsFor(items) {
  const m = new Map();
  for (const i of items) { if (!m.has(i.sec)) m.set(i.sec, []); m.get(i.sec).push(i); }
  return [...m.entries()].sort((a, b) => a[0] - b[0]).map(([no, its], idx) => ({no, idx: idx + 1, name: its[0].section, items: its}));
}

/* ---------------- current site ---------------- */
let cur = null, curItems = [], curSections = [], photoURL = {};
const val = code => (cur.values[code] ||= {});
/* Every change is written straight away. Writes are queued so they land in order;
   if a write is already waiting in the queue it will pick up the latest state, so no extra write is added. */
let saveChain = Promise.resolve(), savePending = false;
function saveNow() {
  if (!cur) return saveChain;
  cur.updated = new Date().toISOString();
  if (savePending) return saveChain;
  savePending = true;
  const site = cur;
  saveChain = saveChain.then(() => { savePending = false; return dbPut("sites", site); })
    .catch(e => toast("SAVE FAILED: " + e.message, 6000));
  return saveChain;
}
const scheduleSave = saveNow;

async function loadSite(uid) {
  if (cur && cur.uid === uid) return true;
  await saveChain;
  Object.values(photoURL).forEach(u => URL.revokeObjectURL(u)); photoURL = {};
  cur = await dbGet("sites", uid);
  if (!cur) return false;
  curItems = itemsFor(cur.type_code); curSections = sectionsFor(curItems);
  for (const p of await sitePhotos(uid)) photoURL[p.ref] = URL.createObjectURL(p.blob);
  return true;
}

/* ---------------- validation / stats ---------------- */
function photosOf(site, code) { return site.photos.filter(p => p.item === code).map(p => p.ref); }
function isAnswered(site, it) {
  const x = site.values[it.code] || {};
  if (it.type === "CHECK") return !!x.status;
  if (it.photo && it.mand) return photosOf(site, it.code).length > 0;
  return String(x.value ?? "").trim() !== "";
}
function validate(site) {
  const items = itemsFor(site.type_code), errs = [], warns = [];
  for (const it of items) {
    const x = site.values[it.code] || {};
    const at = {code: it.code, sec: it.sec};
    if (it.type === "CHECK") {
      if (!x.status) { errs.push({...at, msg: `${it.desc}: no status`}); continue; }
      if (x.status === "Defect") {
        if (!x.rating) errs.push({...at, msg: `${it.desc}: defect without rating`});
        if (it.photo && !photosOf(site, it.code).length) errs.push({...at, msg: `${it.desc}: defect without photo`});
        if (!String(x.comment || "").trim()) warns.push({...at, msg: `${it.desc}: defect without comment`});
      }
    } else if (it.mand) {
      if (it.photo) { if (!photosOf(site, it.code).length) errs.push({...at, msg: `${it.desc}: photos required`}); }
      else if (!String(x.value ?? "").trim()) errs.push({...at, msg: `${it.desc}: required`});
    }
  }
  const eqSec = items.find(i => i.sec === 10) ? 10 : null;
  if (eqSec) {
    if (!site.equipment.length) warns.push({sec: 10, code: "", msg: "Equipment table is empty"});
    site.equipment.forEach((e, n) => {
      if (e.qty_found === "" && e.count_basis !== "Rigger required") warns.push({sec: 10, code: "", msg: `Equipment row ${n+1} (${e.label || e.category}): quantity found missing`});
      if (e.qty_lc === "") warns.push({sec: 10, code: "", msg: `Equipment row ${n+1} (${e.label || e.category}): quantity on LC missing`});
    });
    const method = (site.values["AL-EQP-01"] || {}).value;
    if (method === NOT_COUNTABLE && !items.some(i => i.sec === 10 && (site.values[i.code] || {}).status === "Rigger required"))
      warns.push({sec: 10, code: "", msg: "Count method is 'not countable' but no equipment item is set to Rigger required"});
  }
  return {errs, warns};
}
function stats(site) {
  const items = itemsFor(site.type_code);
  const counts = {Critical: 0, High: 0, Medium: 0, Low: 0}, st = {};
  let answered = 0;
  for (const it of items) {
    if (isAnswered(site, it)) answered++;
    const x = site.values[it.code] || {};
    if (it.type === "CHECK" && x.status) st[x.status] = (st[x.status] || 0) + 1;
    if (x.status === "Defect" && x.rating) counts[x.rating]++;
  }
  const overall = RATINGS.find(r => counts[r] > 0) || "";
  return {total: items.length, answered, counts, st, overall};
}
function chips(counts) {
  return RATINGS.filter(r => counts[r]).map(r => `<span class="chip ${r}">${counts[r]} ${r}</span>`).join("");
}

/* ---------------- router ---------------- */
const app = $("#app");
window.addEventListener("hashchange", route);
async function route() {
  const h = location.hash.replace(/^#\/?/, "");
  const [path, query] = h.split("?");
  const parts = path.split("/").filter(Boolean);
  const q = new URLSearchParams(query || "");
  window.scrollTo(0, 0);
  try {
    if (!parts.length) return renderHome();
    if (parts[0] === "new") return renderNew();
    if (parts[0] === "site" && parts[1]) {
      if (!(await loadSite(parts[1]))) { location.hash = "#/"; return; }
      if (parts[2] === "sec") return renderSection(Number(parts[3]), q.get("focus"));
      if (parts[2] === "review") return renderReview();
      return renderSite();
    }
    location.hash = "#/";
  } catch (e) {
    app.innerHTML = `<main><div class="card issue err">Error: ${esc(e.message)}</div><a class="btn" href="#/">Home</a></main>`;
    console.error(e);
  }
}
function bar(title, sub, back) {
  return `<header class="bar">${back ? `<button aria-label="Back" onclick="location.hash='${back}'">&#8249;</button>` : ""}
    <h1>${esc(title)}${sub ? `<div class="sub">${esc(sub)}</div>` : ""}</h1>${LOGO ? `<img class="logo" src="${LOGO}" alt="GME">` : ""}</header>`;
}
function brandBar(title) {
  return `<header class="bar brand">${LOGO ? `<img src="${LOGO}" alt="Ghada Al Marzooq Engineering">` : ""}<h1>${esc(title)}</h1></header>`;
}

/* ---------------- home ---------------- */
async function renderHome() {
  await saveChain;
  const sites = (await dbAll("sites")).sort((a, b) => (b.updated || "").localeCompare(a.updated || ""));
  const rows = sites.map(s => {
    const t = typeOf(s.type_code), stt = stats(s);
    const pct = stt.total ? Math.round(100 * stt.answered / stt.total) : 0;
    return `<div class="card list"><a class="item" href="#/site/${s.uid}">
      <div class="grow"><div class="desc">${esc(s.site_id)}</div>
      <div class="muted">${esc(t ? t.label : s.type_code)} &middot; ${pct}% &middot; ${esc((s.updated || "").slice(0, 10))}${s.exported_at ? " &middot; exported" : ""}</div>
      <div>${chips(stt.counts)}</div>
      <div class="progress"><div style="width:${pct}%"></div></div></div><div>&#8250;</div></a></div>`;
  }).join("");
  app.innerHTML = brandBar("PRS Site Inspection") + `<main>
    ${rows || `<div class="card muted">No sites on this phone yet. Tap <b>New site</b> to start.</div>`}
    <h2>Settings</h2>
    <div class="card"><div class="lbl">Your name (pre-filled as inspecting engineer on new sites)</div>
      <input type="text" id="engSel" value="${esc(setting("engineer"))}" autocomplete="name">
      <p class="muted">Data is stored on this phone only. Export each site after the visit and send the file to the office.
      Do not clear browser data before exporting.</p>
      <p class="muted">App ${esc(APP_VERSION)} &middot; Library ${esc(LIB.version)}</p></div>
  </main><nav class="bottom"><a class="btn primary" href="#/new">+ New site</a></nav>`;
  $("#engSel").onchange = e => setting("engineer", e.target.value.trim());
}

/* ---------------- new site ---------------- */
async function renderNew() {
  app.innerHTML = bar("New site", "", "#/") + `<main><div class="card">
    <div class="lbl">Site ID <span class="req">*</span></div>
    <input type="text" id="sid" autocapitalize="characters" autocomplete="off" placeholder="e.g. BH-0123">
    <div class="lbl">Structure type <span class="req">*</span></div>
    <div class="seg" id="types">${LIB.types.map(t => `<button class="opt" data-t="${t.code}">${esc(t.label)}</button>`).join("")}</div>
    <p class="muted" id="tdesc"></p></div></main>
    <nav class="bottom"><button class="btn primary" id="create">Create site</button></nav>`;
  let typeCode = "";
  $("#types").onclick = e => {
    const b = e.target.closest("button"); if (!b) return;
    typeCode = b.dataset.t;
    $("#types").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    $("#tdesc").textContent = typeOf(typeCode).desc + " - " + itemsFor(typeCode).length + " items";
  };
  $("#create").onclick = async () => {
    const sid = $("#sid").value.trim().toUpperCase();
    if (!sid) return toast("Enter the Site ID");
    if (!typeCode) return toast("Choose the structure type");
    const existing = (await dbAll("sites")).find(s => s.site_id === sid);
    if (existing && !confirm(`Site ${sid} already exists on this phone. Create another copy?`)) return;
    const uid = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    const site = {uid, site_id: sid, type_code: typeCode, created: new Date().toISOString(), updated: new Date().toISOString(),
      library_version: LIB.version, values: {}, photos: [], equipment: [], next_photo: 1, exported_at: ""};
    site.values["AL-SD-01"] = {value: sid};
    site.values["AL-SD-03"] = {value: typeOf(typeCode).label};
    site.values["AL-SD-08"] = {value: today()};
    if (setting("engineer")) site.values["AL-SD-09"] = {value: setting("engineer")};
    await dbPut("sites", site);
    try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
    location.hash = `#/site/${uid}`;
  };
}

/* ---------------- site overview ---------------- */

const itemByCode = code => curItems.find(i => i.code === code);

function photoStrip(it) {

      `<textarea data-f="value" rows="1" ${it.photo ? 'placeholder="Notes (optional)"' : ""}>${esc(v)}</textarea>`}`;
  }

function refreshCard(code) {

let pendingPhotoCode = null;
function onCardClick(e) {
  const b = e.target.closest("[data-act]"); if (!b) return;
  if (b.closest("#eqCard")) return onEqClick(e, b);
  const card = b.closest("[data-code]"); const code = card && card.dataset.code; const act = b.dataset.act;
  if (act === "view") return viewPhoto(b.dataset.ref);
  if (!code) return;
  const x = val(code);
  if (act === "status") {
    x.status = x.status === b.dataset.v ? "" : b.dataset.v;
    if (x.status !== "Defect") delete x.rating;
  } else if (act === "rating") {
    x.rating = x.rating === b.dataset.v ? "" : b.dataset.v;
  } else if (act === "opt") {
    x.value = x.value === b.dataset.v ? "" : b.dataset.v;
    if (code === "AL-EQP-01") { scheduleSave(); refreshCard(code); return; }
  } else if (act === "comment") {
    x.comment = x.comment || ""; refreshCard(code);
    const ta = document.querySelector(`#c-${CSS.escape(code)} textarea`); if (ta) ta.focus();
    return;
  } else if (act === "photo") {
    pendingPhotoCode = code; $("#fileInput").value = ""; $("#fileInput").click(); return;
  } else if (act === "gps") {
    return getGPS(code);
  }
  scheduleSave(); refreshCard(code);
}
function onCardInput(e) {
  const f = e.target.dataset.f; if (!f) return;
  if (e.target.closest("#eqCard")) return onEqInput(e);
  const card = e.target.closest("[data-code]"); if (!card) return;
  val(card.dataset.code)[f] = e.target.value;
  if (e.type === "change") {
    const it = itemByCode(card.dataset.code);
    if (it && it.type !== "CHECK") card.classList.toggle("done", isAnswered(cur, it));
  }
  scheduleSave();
}
function getGPS(code) {
  if (!navigator.geolocation) return toast("GPS not available");
  toast("Getting location...");
  navigator.geolocation.getCurrentPosition(p => {
    val(code).value = p.coords.latitude.toFixed(6) + ", " + p.coords.longitude.toFixed(6);
    scheduleSave(); refreshCard(code); toast(`Location set (accuracy ${Math.round(p.coords.accuracy)} m)`);
  }, err => toast("Location failed: " + err.message, 4000), {enableHighAccuracy: true, timeout: 20000, maximumAge: 0});
}

/* ---------------- photos ---------------- */
$("#fileInput").addEventListener("change", async e => {
  const files = [...e.target.files]; const code = pendingPhotoCode; pendingPhotoCode = null;
  if (!files.length || !code || !cur) return;
  for (const f of files) {
    try {
      const blob = await resizeImage(f);
      const ref = "P" + String(cur.next_photo++).padStart(3, "0");
      await dbPut("photos", {key: cur.uid + "/" + ref, uid: cur.uid, ref, blob});
      cur.photos.push({ref, item: code, taken: new Date().toISOString()});
      photoURL[ref] = URL.createObjectURL(blob);
      await saveNow();
    } catch (err) { toast("Photo failed: " + err.message, 4000); }
  }
  refreshCard(code);
});
async function resizeImage(file, max = 1600, q = 0.82) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("cannot read image")); i.src = url; });
    const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.round(img.naturalWidth * s), h = Math.round(img.naturalHeight * s);
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    c.getContext("2d").drawImage(img, 0, 0, w, h);
    const blob = await new Promise(res => c.toBlob(res, "image/jpeg", q));
    if (!blob) throw new Error("cannot convert image");
    return blob;
  } finally { URL.revokeObjectURL(url); }
}
function viewPhoto(ref) {
  const p = cur.photos.find(x => x.ref === ref); if (!p) return;
  const it = itemByCode(p.item);
  const ov = document.createElement("div"); ov.className = "overlay";
  ov.innerHTML = `<img src="${photoURL[ref]}" alt="${ref}"><div style="margin-top:8px"><b>${ref}</b> &middot; ${esc(it ? it.desc : p.item)}</div>
    <div class="row"><button class="btn danger" data-a="del">Delete photo</button><button class="btn primary" data-a="close">Close</button></div>`;
  ov.onclick = async e => {
    const a = e.target.dataset.a;
    if (a === "close" || e.target === ov) ov.remove();
    if (a === "del" && confirm(`Delete photo ${ref}?`)) {
      cur.photos = cur.photos.filter(x => x.ref !== ref);
      await dbDel("photos", cur.uid + "/" + ref);
      URL.revokeObjectURL(photoURL[ref]); delete photoURL[ref];
      await saveNow(); ov.remove(); refreshCard(p.item);
    }
  };
  document.body.appendChild(ov);
}

const eqDiff = e => e.qty_lc !== "" && e.qty_found !== "" ? Number(e.qty_found) - Number(e.qty_lc) : null;
const fmtDiff = d => d === null ? "-" : `<span class="${d > 0 ? "diff-pos" : ""}">${d > 0 ? "+" : ""}${d}</span>`;
function refreshEq() { const el = $("#eqCard"); if (el) el.innerHTML = eqHTML(); }
function onEqClick(e, b) {

async function doExport(share) {
  await saveNow();
  const {errs, warns} = validate(cur);
  if (errs.length && !confirm(`${errs.length} item(s) are not complete. Export anyway (e.g. as a backup)?`)) return;
  toast("Preparing file...");
  try {
    const blob = await buildExport(cur, errs, warns);
    const stamp = new Date().toISOString().slice(0, 16).replace(/[-:]/g, "").replace("T", "-");
    const name = `${cur.site_id.replace(/[^A-Za-z0-9._-]+/g, "_")}_field_${stamp}.zip`;
    const file = new File([blob], name, {type: "application/zip"});
    let shared = false;
    if (share && navigator.canShare && navigator.canShare({files: [file]})) {
      try { await navigator.share({files: [file], title: name}); shared = true; }
      catch (e) { if (e.name === "AbortError") return; }
    }
    if (!shared) {
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    }
    cur.exported_at = new Date().toISOString(); await saveNow();
    toast(shared ? "Shared" : `Saved ${name}`, 4000);
  } catch (e) { toast("Export failed: " + e.message, 5000); console.error(e); }
}
async function buildExport(site, errs, warns) {
  const t = typeOf(site.type_code);
  const items = itemsFor(site.type_code).map(i => {
    const x = site.values[i.code] || {};
    return {code: i.code, sec: i.sec, section: i.section, rfq: i.rfq, desc: i.desc, look: i.look, input_type: i.type,
      options: i.options, default_rating: i.rating, photo_required: i.photo, mandatory: i.mand, rec: i.rec,
      status: x.status || "", rating: x.status === "Defect" ? (x.rating || "") : "", value: x.value ?? "",
      comment: x.comment || "", photos: photosOf(site, i.code), recommendation: ""};
  });
  const data = {format: "PRS-FIELD", format_version: 1, app_version: APP_VERSION, library_version: LIB.version,
    exported_at: new Date().toISOString(), source: "Phone form", site_id: site.site_id, type_code: site.type_code,
    type_label: t ? t.label : site.type_code, complete: errs.length === 0,
    issues: [...errs.map(i => "Missing: " + i.msg), ...warns.map(i => "Warning: " + i.msg)],
    items, equipment: site.equipment,
    photos: site.photos.map(p => ({ref: p.ref, item: p.item, file: `photos/${p.ref}.jpg`, taken: p.taken}))};
  const enc = new TextEncoder();
  const files = [{name: "checklist.json", data: enc.encode(JSON.stringify(data, null, 1))}];
  for (const p of await sitePhotos(site.uid)) {
    if (site.photos.some(x => x.ref === p.ref)) files.push({name: `photos/${p.ref}.jpg`, data: new Uint8Array(await p.blob.arrayBuffer())});
  }
  return makeZip(files);
}

/* ---------------- minimal ZIP writer (stored, no compression) ---------------- */
const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function makeZip(files) {
  const enc = new TextEncoder(), parts = [], central = [], d = new Date();
  const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  let offset = 0;
  for (const f of files) {
    const name = enc.encode(f.name), crc = crc32(f.data), size = f.data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, time, true); lh.setUint16(12, date, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, size, true); lh.setUint32(22, size, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(lh.buffer, name, f.data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
    ch.setUint16(10, 0, true); ch.setUint16(12, time, true); ch.setUint16(14, date, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, size, true); ch.setUint32(24, size, true); ch.setUint16(28, name.length, true);
    ch.setUint32(42, offset, true);
    central.push(ch.buffer, name);
    offset += 30 + name.length + size;
  }
  const cdSize = central.reduce((a, b) => a + b.byteLength, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, end.buffer], {type: "application/zip"});
}
